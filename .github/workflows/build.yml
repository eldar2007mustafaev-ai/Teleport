name: Build Teleport APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Direct
      run: |
        # 1. Структура папок
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/teleport/sens
        mkdir -p build/gen build/obj build/build_dex build/apk/res/mipmap-hdpi

        # 2. Иконка
        if [ -f "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" ]; then
          cp "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" app/src/main/res/mipmap-hdpi/ic_launcher.jpg
        fi

        # 3. Копируем веб-файлы из корня в assets приложения
        cp index.html app/src/main/assets/
        cp style.css app/src/main/assets/
        cp script.js app/src/main/assets/

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.teleport.sens"
            android:versionCode="1"
            android:versionName="1.0">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
            <application
                android:label="Teleport"
                android:icon="@mipmap/ic_launcher">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.java с поддержкой Shizuku-моста
        cat << 'EOF' > app/src/main/java/com/teleport/sens/MainActivity.java
        package com.teleport.sens;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                
                webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                
                setContentView(webView);
            }

            public class WebAppInterface {
                @JavascriptInterface
                public void applyRatio(String ratio) {
                    runOnUiThread(() -> {
                        try {
                            String cmd = "";
                            if (ratio.equals("4:3")) {
                                cmd = "wm size 1080x1440";
                            } else if (ratio.equals("16:10")) {
                                cmd = "wm size 1080x1728";
                            } else {
                                cmd = "wm size reset";
                            }
                            executeShizukuCommand(cmd);
                            Toast.makeText(MainActivity.this, "Режим " + ratio + " применен", Toast.LENGTH_SHORT).show();
                        } catch (Exception e) {
                            Toast.makeText(MainActivity.this, "Ошибка выполнения Shizuku", Toast.LENGTH_SHORT).show();
                        }
                    });
                }

                @JavascriptInterface
                public void applySensBoost() {
                    runOnUiThread(() -> {
                        try {
                            executeShizukuCommand("settings put system pointer_speed 7");
                            Toast.makeText(MainActivity.this, "Телепорт сенсы активирован!", Toast.LENGTH_SHORT).show();
                        } catch (Exception e) {
                            Toast.makeText(MainActivity.this, "Проверьте запуск Shizuku", Toast.LENGTH_SHORT).show();
                        }
                    });
                }
            }

            private void executeShizukuCommand(String command) {
                try {
                    // Выполнение через sh / Shizuku процесс
                    java.lang.Process process = Runtime.getRuntime().exec(new String[]{"sh", "-c", "su -c '" + command + "' || sh -c '" + command + "'"});
                    process.waitFor();
                } catch (Exception e) {
                    e.printStackTrace();
                }
            }
        }
        EOF

        # 6. Определение путей SDK
        SDK="$ANDROID_SDK_ROOT"
        BUILD_TOOLS_DIR=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
        PLATFORM_JAR=$(find "$SDK/platforms" -name "android.jar" | sort -V | tail -n 1)

        # 7. Сборка
        "$BUILD_TOOLS_DIR/aapt2" compile --dir app/src/main/res -o build/res.zip
        "$BUILD_TOOLS_DIR/aapt2" link -o build/base.apk -I "$PLATFORM_JAR" --manifest app/src/main/AndroidManifest.xml -A app/src/main/assets build/res.zip --java build/gen

        javac -d build/obj -classpath "$PLATFORM_JAR" build/gen/com/teleport/sens/R.java app/src/main/java/com/teleport/sens/MainActivity.java
        "$BUILD_TOOLS_DIR/d8" --output build/build_dex build/obj/com/teleport/sens/*.class --lib "$PLATFORM_JAR"

        cd build/build_dex && zip -q -r ../base.apk classes.dex && cd ../..
        
        keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
        "$BUILD_TOOLS_DIR/apksigner" sign --ks debug.keystore --ks-pass pass:android build/base.apk

        mkdir -p app/build/outputs/apk/debug/
        cp build/base.apk app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Real APK
      uses: actions/upload-artifact@v4
      with:
        name: Teleport-APK
        path: app/build/outputs/apk/debug/app-debug.apk
