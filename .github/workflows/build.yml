name: Build Teleport APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Direct
      run: |
        # 1. Создаем структуру
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/java/com/teleport/sens
        mkdir -p build/gen build/obj build/apk/res/mipmap-hdpi

        # 2. Копируем иконку
        if [ -f "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" ]; then
          cp "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" app/src/main/res/mipmap-hdpi/ic_launcher.jpg
        fi

        # 3. Манифест
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.teleport.sens"
            android:versionCode="1"
            android:versionName="1.0">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
            <application
                android:label="Teleport"
                android:icon="@mipmap/ic_launcher">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 4. Исходный код Java
        cat << 'EOF' > app/src/main/java/com/teleport/sens/MainActivity.java
        package com.teleport.sens;
        import android.app.Activity;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                finish();
            }
        }
        EOF

        # 5. Автоматический поиск путей Android SDK
        SDK=$ANDROID_HOME
        BUILD_TOOLS=$(ls -d$SDK/build-tools/* | tail -n 1)
        PLATFORM=$(ls$SDK/platforms/android-*/android.jar | tail -n 1)

        echo "Using Build Tools from: $BUILD_TOOLS"
        echo "Using Platform Jar: $PLATFORM"

        # Компиляция ресурсов
        $BUILD_TOOLS/aapt2 compile --dir app/src/main
