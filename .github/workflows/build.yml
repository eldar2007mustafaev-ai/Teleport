name: Build Teleport APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Direct
      run: |
        # 1. Структура папок
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/teleport/sens
        mkdir -p build/gen build/obj build/build_dex build/apk/res/mipmap-hdpi

        # 2. Иконка
        if [ -f "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" ]; then
          cp "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" app/src/main/res/mipmap-hdpi/ic_launcher.jpg
        fi

        # 3. Файлы интерфейса (HTML / CSS / JS)
        cat << 'EOF' > app/src/main/assets/index.html
        <!DOCTYPE html>
        <html lang="ru">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Teleport</title>
            <style>
                * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
                body { background: #0a0a0c; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
                h1 { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 20px; font-size: 28px; }
                .card { background: #141419; border: 1px solid #00f0ff; border-radius: 12px; padding: 16px; width: 100%; max-width: 400px; margin-bottom: 16px; box-shadow: 0 0 15px rgba(0,240,255,0.1); }
                .card-title { font-size: 16px; color: #ff007f; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; }
                .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
                .btn { flex: 1; padding: 12px; background: #1a1a24; border: 1px solid #333; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
                .btn.active, .btn:active { background: #00f0ff; color: #000; border-color: #00f0ff; box-shadow: 0 0 10px #00f0ff; }
                .action-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #ff007f, #00f0ff); border: none; color: #fff; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
                .result { margin-top: 10px; font-size: 14px; color: #00ff88; text-align: center; }
            </style>
        </head>
        <body>
            <h1>TELEPORT SENS</h1>

            <div class="card">
                <div class="card-title">Растяжение экрана</div>
                <div class="btn-group">
                    <button class="btn active" onclick="setRatio('4:3', this)">4:3</button>
                    <button class="btn" onclick="setRatio('16:10', this)">16:10</button>
                    <button class="btn" onclick="setRatio('16:9', this)">16:9</button>
                </div>
                <div id="ratio-info" class="result">Режим: 4:3 (Сжатие по горизонтали)</div>
            </div>

            <div class="card">
                <div class="card-title">Телепорт Сенса</div>
                <button class="action-btn" onclick="applySens()">Активировать буст сенсы</button>
                <div id="sens-status" class="result">Состояние: Готов к генерации</div>
            </div>

            <script>
                function setRatio(ratio, element) {
                    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
                    element.classList.add('active');
                    document.getElementById('ratio-info').innerText = 'Режим: ' + ratio + ' активирован';
                }

                function applySens() {
                    const status = document.getElementById('sens-status');
                    status.innerText = 'Применение параметров сенсы...';
                    setTimeout(() => {
                        status.innerText = 'Сенса успешно телепортирована и оптимизирована!';
                    }, 500);
                }
            </script>
        </body>
        </html>
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.teleport.sens"
            android:versionCode="1"
            android:versionName="1.0">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
            <application
                android:label="Teleport"
                android:icon="@mipmap/ic_launcher">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.java (Запуск WebView с локальным HTML)
        cat << 'EOF' > app/src/main/java/com/teleport/sens/MainActivity.java
        package com.teleport.sens;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                
                setContentView(webView);
            }
        }
        EOF

        # 6. Определение путей SDK
        SDK="$ANDROID_SDK_ROOT"
        BUILD_TOOLS_DIR=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
        PLATFORM_JAR=$(find "$SDK/platforms" -name "android.jar" | sort -V | tail -n 1)

        # 7. Сборка
        "$BUILD_TOOLS_DIR/aapt2" compile --dir app/src/main/res -o build/res.zip
        "$BUILD_TOOLS_DIR/aapt2" link -o build/base.apk -I "$PLATFORM_JAR" --manifest app/src/main/AndroidManifest.xml -A app/src/main/assets build/res.zip --java build/gen

        javac -d build/obj -classpath "$PLATFORM_JAR" build/gen/com/teleport/sens/R.java app/src/main/java/com/teleport/sens/MainActivity.java
        "$BUILD_TOOLS_DIR/d8" --output build/build_dex build/obj/com/teleport/sens/*.class --lib "$PLATFORM_JAR"

        cd build/build_dex && zip -q -r ../base.apk classes.dex && cd ../..
        
        keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
        "$BUILD_TOOLS_DIR/apksigner" sign --ks debug.keystore --ks-pass pass:android build/base.apk

        mkdir -p app/build/outputs/apk/debug/
        cp build/base.apk app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Real APK
      uses: actions/upload-artifact@v4
      with:
        name: Teleport-APK
        path: app/build/outputs/apk/debug/app-debug.apk
