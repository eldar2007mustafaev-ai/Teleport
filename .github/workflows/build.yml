name: Build Teleport APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Project Structure
      run: |
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/java/com/teleport/sens

        # Копируем иконку
        if [ -f "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" ]; then
          cp "gpt-image-2_A_sleek_futuristic_cyberpunk_app_icon_featuring_a_glowing_neon_letter_T_as_the_c-0.jpg" app/src/main/res/mipmap-hdpi/ic_launcher.jpg
        fi

        # Код приложения
        cat << 'EOF' > app/src/main/java/com/teleport/sens/MainActivity.java
        package com.teleport.sens;
        import android.app.Activity;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                finish();
            }
        }
        EOF

        # Файлы сборки Gradle
        echo "include(':app')" > settings.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

    - name: Build APK with Gradle
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Real APK
      uses: actions/upload-artifact@v4
      with:
        name: Teleport-APK
        path: app/build/outputs/apk/debug/app-debug.apk
