name: Build Teleport APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android SDK Licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a43b680d23c1748d5f3d3d5f47d4e38ef" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          rm -f app/src/main/assets/keys.json

      - name: Build Debug APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SO2Teleport-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
