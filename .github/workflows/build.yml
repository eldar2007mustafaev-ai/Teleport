name: Build Teleport APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Encrypt index.html & Clean Assets (Anti-MT-Manager)
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a43b680d23c1748d5f3d3d5f47d4e38ef" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          rm -f app/src/main/assets/keys.json
          python3 -c '
          import base64, pathlib
          p = pathlib.Path("app/src/main/assets/index.html")
          raw = p.read_bytes()
          b64 = base64.b64encode(raw).decode("ascii")
          wrapped = "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no\"><!-- SO2TELEPORT_QUANTUM_V9_SEAL --><!-- pollLicenseExpiration --></head><body style=\"background:#050711;margin:0;\"><script>(function(){var d=atob(\"" + b64 + "\");var b=new Uint8Array(d.length);for(var i=0;i<d.length;i++)b[i]=d.charCodeAt(i);var html=new TextDecoder(\"utf-8\").decode(b);document.open();document.write(html);document.close();})();</script></body></html>"
          p.write_text(wrapped, encoding="utf-8")
          '
          rm -rf .gradle build app/build gradlew gradlew.bat

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SO2Teleport-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
