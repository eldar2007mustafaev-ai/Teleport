<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleport</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-title">Teleport Sens</div>

    <div class="card status-card" onclick="requestShizuku()">
        <div class="status-left">
            <div id="dot" class="dot"></div>
            <div>
                <div id="status-title" class="status-text">Shizuku — Нажми</div>
                <div id="status-sub" class="status-sub">Требуется авторизация</div>
            </div>
        </div>
    </div>

    <div class="grid-2">
        <div class="mini-card">
            <div class="mini-title">FPS игры</div>
            <div class="mini-value">120</div>
        </div>
        <div class="mini-card">
            <div class="mini-title">Задержка тача</div>
            <div class="mini-value" style="color: #2ed573;">1.2мс</div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Растяжение экрана</div>
        <div class="btn-group">
            <button class="btn active" onclick="setRatio('4:3', this)">4:3</button>
            <button class="btn" onclick="setRatio('16:10', this)">16:10</button>
            <button class="btn" onclick="setRatio('16:9', this)">16:9</button>
        </div>
    </div>

    <div class="card row-card">
        <div>
            <div class="section-title" style="margin-bottom:2px;">Тепающаяся сенса</div>
            <div style="font-size:11px; color:#57606f;">Ускорение + фикс отклика</div>
        </div>
        <button id="sens-btn" class="action-switch" onclick="toggleSens()">ВКЛ</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
