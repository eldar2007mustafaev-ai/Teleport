<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleport</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TELEPORT SENS</h1>

    <!-- Блок статуса Shizuku (кликабельный для принудительного запроса прав) -->
    <div class="card" id="status-card" style="border-color: #ff3333; cursor: pointer;" onclick="requestPermissions()">
        <div class="card-title" style="color: #ff3333;">Статус Shizuku (Нажми для запроса прав)</div>
        <div id="shizuku-status" class="result" style="color: #ff3333;">Проверка...</div>
    </div>

    <div class="card">
        <div class="card-title">Растяжение экрана</div>
        <div class="btn-group">
            <button class="btn active" onclick="setRatio('4:3', this)">4:3</button>
            <button class="btn" onclick="setRatio('16:10', this)">16:10</button>
            <button class="btn" onclick="setRatio('16:9', this)">16:9</button>
        </div>
        <div id="ratio-info" class="result">Режим: 4:3 (Сжатие по горизонтали)</div>
    </div>

    <div class="card">
        <div class="card-title">Телепорт Сенса</div>
        <button class="action-btn" onclick="applySens()">Активировать буст сенсы</button>
        <div id="sens-status" class="result">Состояние: Готов к генерации</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
